.pv-ins h4{margin:0 0 4px;font-size:14px;color:#1C1B19}
.pv-ins p{margin:0;font-size:13px;line-height:1.55;color:#3B3934}
.pv-ins.ghost{border:1.5px dashed #C8962F;background:rgba(224,179,106,.1)}
.pv-ins.ghost p,.pv-ins.ghost h4{opacity:.75}
.pv-ins.draft{border:1.5px solid #C8962F;background:rgba(224,179,106,.18)}
.pv-ins.live{border:1px solid #E4E0D8;background:#fff}
.pv-tag{position:absolute;top:-10px;left:12px;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;background:#C8962F;color:#fff}
.pv-ins.live .pv-tag{background:#5E8B68}
.pv-hero .pv-ins{max-width:460px;margin:18px auto 0}

.pv-curh{background:rgba(224,179,106,.18);display:inline-block;padding:0 6px;border-radius:4px}
.pv-stat{margin:14px 0 0;font-size:12px;color:#6A665E}
.pv-faq{list-style:none!important;padding:0!important;margin:12px 0 0!important;display:grid;gap:0!important}
.pv-faq li{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #E4E0D8;font-size:13px;color:#1C1B19}
.pv-faq li span{color:#8A857C}

/* A / B / C layout switch, shown in the workspace next to the prototype button */
.plan-switch{display:none}
body.ws-mode .proto{display:flex;align-items:center;gap:8px}
body.ws-mode .plan-switch{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,233,168,.85);box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.plan-switch button{min-width:30px;padding:0 7px;height:28px;border-radius:999px;font-family:var(--mono);font-size:13px;font-weight:600;color:#6B5A1E}
.plan-switch button:hover{color:#3B2F00;background:rgba(255,255,255,.35)}
.plan-switch button.on{background:#3B2F00;color:#FFE9A8}

/* suggested question + streamed answer */
.ask-chip{display:block;width:100%;text-align:left;margin-bottom:8px;padding:8px 12px;border-radius:6px;border:1px dashed var(--line-2);font-size:13px;color:var(--ink-2)}
.ask-chip:hover{color:var(--ink);border-color:var(--accent)}
.ask-chip::before{content:"↳ ";color:var(--accent)}
.streamed{white-space:pre-line}
.caret{display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;background:var(--accent);animation:bl 1s steps(1) infinite}

.ws-chat-b>*{flex-shrink:0}

/* page-per-chat */
.ws-gh{display:flex;align-items:center}
.gh-add{margin-left:auto;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:15px;color:var(--ink-2)}
.gh-add:hover{background:var(--surface-2);color:var(--ink)}
.ci-t{display:flex;align-items:center;gap:6px;width:100%}
.ci-t .hash{font-style:normal;color:var(--ink-3);font-family:var(--mono);font-size:12px}
.ci-t .nd{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:auto;box-shadow:0 0 0 3px var(--accent-soft)}
.ws-sum{margin:6px 0 0;font-size:13px;color:var(--accent-ink)}
.sum-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;width:100%}
.sum-list li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--glass-line);border-radius:6px;font-size:13px}
.ws-chat-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ws-chat-h .newchat{height:30px;font-size:12px;flex:none}
.tk .pill{margin-left:auto;flex:none}
.pv-trial{margin-top:12px;border:1px solid #E4E0D8;border-radius:8px;padding:14px 16px;display:grid;gap:4px;font-size:13px;color:#3B3934;background:rgba(224,179,106,.12)}
.pv-trial b{color:#1C1B19}.pv-trial i{font-style:normal;font-family:var(--display);font-size:22px;color:#1C1B19}.pv-trial s{color:#8A857C;font-size:14px}
.pv-trial ul{margin:4px 0 0;padding-left:16px}
.pv-ins.focus{outline:2px solid #C8962F;outline-offset:2px}

/* chat list: rename / delete for site-wide chats */
.ci-row{position:relative;display:flex;align-items:stretch}
.ci-row .ws-item{flex:1;min-width:0}
.ci-more{width:26px;flex:none;border-radius:6px;color:var(--ink-3);opacity:0;font-size:14px}
.ci-row:hover .ci-more,.ci-more[aria-expanded="true"],.ci-more:focus-visible{opacity:1}
.ci-more:hover{background:var(--surface-2);color:var(--ink)}
.ci-menu{position:absolute;right:0;top:100%;z-index:10;min-width:130px;padding:4px;border-radius:6px;background:#1B1B1A;border:1px solid var(--line-2);box-shadow:0 16px 30px -12px #000;display:flex;flex-direction:column}
.ci-menu button{text-align:left;padding:7px 10px;border-radius:4px;font-size:13px;color:var(--ink-2)}
.ci-menu button:hover{background:var(--surface-2);color:var(--ink)}
.ci-menu .danger{color:#E5484D}
.ci-input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--glass-sunken);border:1px solid var(--accent);border-radius:6px;padding:7px 10px;outline:none}
.ci-confirm{padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:#161616;font-size:12px}
.ci-confirm p{margin:0 0 8px;color:var(--ink-2)}
.ci-confirm div{display:flex;gap:6px}

.ws-foot .ws-more{margin-bottom:8px;padding-top:12px;border-top:1px solid var(--glass-line)}
.ws-foot .ws-more .ws-item{font-size:13px;padding:5px 10px}

/* per-page timeline; selected suggestion */
.tl-wrap{display:flex;flex-direction:column;gap:8px}
.tl-h{font-size:12px;color:var(--ink-3)}
.tl{display:flex;gap:8px;flex-wrap:wrap}
.tl button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:170px;padding:9px 12px;border:1px solid var(--glass-line);border-radius:6px;background:var(--glass-strong);text-align:left}
.tl button:hover{border-color:var(--line-2)}
.tl button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tl small{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tl .latest{color:var(--accent-ink)}
.tl b{font-weight:500;font-size:13px;color:var(--ink)}
.tl span{font-size:12px;color:var(--ink-2)}
.ws-trow-tl{padding:4px 16px 14px 50px;background:#1B1B1A;box-shadow:inset 2px 0 0 var(--accent)}
.sg{display:flex;flex-direction:column;gap:14px;border-radius:8px}
.sg.multi{cursor:pointer}
.sg.multi:not(.sel) .cc{opacity:.72}
.sg.multi:not(.sel):hover .cc{opacity:1}
.sg.sel .cc{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>

 "w.tl.n":"Check #{n}","w.tl.latest":"latest", "q.flashWhy":"Why does ChatGPT recommend Quizlet here?","r.flashWhy":"When people ask how to turn a textbook into flashcards with AI, ChatGPT cites how-to pages from Quizlet and Knowt that spell out the steps. Your flashcards page only says “snap a photo”, not how it works. The FAQ above fills that gap.","q.priceTier":"Should I spell out free vs. paid?","r.priceTier":"Yes. “Is it free?” is the first thing students and parents ask. The text above already says what's free; what Premium adds can follow in the same paragraph. Want me to rewrite it to cover both?","q.faqTone":"Could this answer put teachers off?","r.faqTone":"Unlikely. It stresses explaining every step so students learn to solve it themselves, not handing over answers, which is what teachers and parents care about. To be safer, you could add: “Try it yourself first, then use Answer.AI to check.”","q.faqComp":"How do competitors answer this question?","r.faqComp":"Khanmigo presents itself as a tutor that guides you rather than giving answers, and Socratic stresses explanations. That framing is part of why ChatGPT cites them. It's a site-wide competitor question, so it's better in its own chat.","site.comp.t":"How competitors handle “cheating”","site.comp.a":"From your checks: when people ask whether AI homework help is cheating, ChatGPT leans on tools that describe themselves as tutors, like Khanmigo (“guides you instead of giving answers”) and Socratic (step-by-step explanations).\n\nFor Answer.AI, the FAQ answer is a good first step. Later, a dedicated page on how to use AI to learn, not to copy, would give ChatGPT more to cite.", "w.cm.more":"More","w.cm.rename":"Rename","w.cm.delete":"Delete","w.cm.cancel":"Cancel","w.cm.confirm":"Delete this chat? This can't be undone.","w.toast.deleted":"Chat deleted","w.toast.renamed":"Renamed","w.o.overview":"Your first check is done. I asked ChatGPT 10 questions your customers ask: 6 answers mention {b}, and 2 cite y ectly. For the others I'll explain what to do, and more of it will be automated soon.", "dg.toWs":"Create your workspace to see results", "und.whatv":"AI tutor and homework help for students: step-by-step answers, flashcards, AP prep and college counseling.","t1.title":"Flashcards page · add a FAQ","t1.why":"ChatGPT doesn't mention you for “How to make flashcards from a textbook with AI”","t1.page":"Flashcards page","t2.title":"Homepage · spell out photo math help","t2.why":"You're missing from “App that solves math problems from a photo”","t2.page":"Homepage","t3.title":"FAQ · answer “Is it cheating?”","t3.why":"You're missing from “Is using AI for homework cheating?”","t3.page":"FAQ","w.c.suggest":"Your flashcards page could use a short FAQ on turning a textbook into cards.","w.c.opt1":"Flashcards page: add a FAQ on turning a textbook into cards.","w.c.opt2":"Homepage: say plainly that you solve math problems from a photo.","w.c.opt3":"FAQ: answer “Is using AI for homework cheating?”","w.c.result":"Checked. For “How to make flashcards from a textbook with AI”, ChatGPT now mentions you and cites your flashcards page. Overall: mentioned 7/10 (was 6), your site cited 3/10 (was 2).","w.c.next":"Next: you're missing from “App that solves math problems from a photo”.","w.c.ccH":"Flashcards page · add a FAQ","w.topic.name":"Flashcards page · add a FAQ","w.topic.page":"Flashcards page","w.res.faq":"Flashcards page FAQ","w.res.orig":"Flashcards page original","w.rv.srcNote":"Saved from the flashcards page. All hand edits and saved content are kept; using a change creates a new save record and never overwrites the source.","w.sample":"Example data · not a real check", "plan.h":"Layout plan","plan.A":"A · A sub-page per fix","plan.B":"B · Dashboard stays","plan.B2":"B2 · Two columns","plan.B3":"B3 · Dashboard (issue rows) + chat","plan.B4":"B4 · Dashboard + issue list + chat","w.b4.queue":"All issues","w.i.intro":"Check #{n} found this on your {p} ({url}). Everything about t  "w.tl.n":"第 {n} 次检查","w.tl.latest":"最新", "q.flashWhy":"为什么 ChatGPT 推荐的是 Quizlet？","r.flashWhy":"问到怎么用 AI 把课本做成闪卡时，ChatGPT 引用的是 Quizlet 和 Knowt 的教程页，它们把步骤写得很清楚。你的闪卡页只说了「拍照就能生成」，没有写具体怎么做。上面这段 FAQ 就是补上这一块。","q.priceTier":"免费和付费的区别要写进去吗？","r.priceTier":"建议写。学生和家长最先问的就是「到底免不免费」。上面那段已经说清楚免费能用什么；付费多了什么可以接在同一段后面。要的话我把它改写成一版两部分都有的。","q.faqTone":"这段回答会不会让老师反感？","r.faqTone":"不太会。这段强调的是讲清每一步、帮学生自己学会，而不是直接给答案，这正是老师和家长关心的。想更稳妥的话，可以再加一句「建议先自己做，再用 Answer.AI 检查」。","q.faqComp":"别的竞品是怎么回答这个问题的？","r.faqComp":"Khanmigo 把自己定位成「引导你思考、不直接给答案」的家教，Socratic 也强调讲解过程，这是 ChatGPT 愿意引用它们的原因之一。这属于整站层面的竞品问题，放在单独的对话里聊更合适。","site.comp.t":"竞品怎么谈「作弊」","site.comp.a":"从检查结果看：有人问「用 AI 写作业算不算作弊」时，ChatGPT 更愿意引用把自己定位成家教的工具，比如 Khanmigo（引导思考、不直接给答案）和 Socratic（分步讲解）。\n\n对 Answer.AI 来说，常见问题里补的这段是第一步；之后可以考虑单独做一页「怎么用 AI 学习而不是抄答案」，给 ChatGPT 更多可以引用的内容。", "w.cm.more":"更多","w.cm.rename":"重命名","w.cm.delete":"删除","w.cm.cancel":"取消","w.cm.confirm":"删除这段对话？删除后无法恢复。","w.toast.deleted":"已删除对话","w.toast.renamed":"已重命名","w.o.overview":"第一次检查完成。我用客户常问的 10 个问题问了 ChatGPT：6 个回答提到了 {b}，2 个引用了你的网站。有 3 个页面可以做得更好，每个页面单独一段对话：","w.o.page":"这段对话专门聊你的{p}（{url}）。这个页面现在和以后的检查结果、改动，都会留在这里。","w.o.pageNew":"你的{p}（{url}）第一次出现在检查结果里，所以我给它单独开了这段对话。这个页面以后的内容都会留在这里。","w.o.lead":"我写好了一段可以加上去的内容，你决定用不用：","w.o.from":"接着你在{p}对话里问的这个问题：","site.new.a":"这是一段整站对话，适合聊不属于某个页面的问题，比如竞品为什么被推荐、网站整体怎么介绍自己。想从哪儿开始？", "f.problem":"ChatGPT 推荐的是 Sugar Loaf、Petite Crumb 和 Maple & Rye。你的蛋糕页从没提到可以做无麸质蛋糕。", "p.flash":"闪卡页","p.pricing":"定价页","p.faq":"常见问题","p.home":"首页","s.flash1.t":"补充 FAQ","s.flash1.why":"问到「How to make flashcards from a textbook with AI」时，ChatGPT 没有提到你","s.pricing1.t":"写清楚哪些免费","s.pricing1.why":"问到「Free AI homework help app」时，没有提到你","s.faq1.t":"回答「算不算作弊」","s.faq1.why":"问到「Is using AI for homework cheating?」时，没有提到你","s.pricing2.t":"和 Chegg、Photomath 做对比","s.pricing2.why":"大家拿你和 Chegg 比较时，ChatGPT 没有引用你的定价页","s.home2.t":"写清楚拍照解数学题","s.home2.why":"问到「App that solves math problems from a photo」时，没有提到你","w.nav.convs":"对话","w.nav.new":"新对话","cst.todo":"待查看"," d":"C09 · 闪卡页收到结果", "w.c.more.q":"除了文案，还有什么能起到优化效果？","w.c.more.a":"除了改文案，这几类做法也能让 AI 更常提到你：\n\n1. 新增内容：补上缺少的页面，比如「Answer.AI vs Photomath」对比页、AP 备考指南。（即将上线）\n2. 技术设置：允许 GPTBot 等 AI 爬虫抓取你的网站，给 FAQ 加上结构化数据，让 AI 更容易读懂。\n3. 站外提及：ChatGPT 常引用 Reddit、YouTube 和「最佳学习 App」榜单，争取出现在这些地方。（即将上线）\n4. 品牌一致：App Store、Chrome 商店和社交账号上的名称、介绍保持一致。\n\n目前我可以直接帮你写好文案改动；其他几类我会告诉你具体怎么做，自动化功能会陆续上线。", "dg.toWs":"创建工作区，查看结果", "und.whatv":"面向学生的 AI 家教和作业辅导：分步讲解、AI 闪卡、AP 备考和升学顾问。","t1.title":"闪卡页 · 补充 FAQ","t1.why":"问到「How to make flashcards from a textbook with AI」时，ChatGPT 没有提到你","t1.page":"闪卡功能页","t2.title":"首页 · 写清楚拍照解数学题","t2.why":"问到「App that solves math problems from a photo」时，没有提到你","t2.page":"首页","t3.title":"FAQ · 回答「算不算作弊」","t3.why":"问到「Is using AI for homework cheating?」时，没有提到你","t3.page":"常见问题","w.c.suggest":"闪卡功能页可以补一段「怎么把课本变成闪卡」的 FAQ。","w.c.opt1":"闪卡页：补一段「怎么把课本变成闪卡」的 FAQ。","w.c.opt2":"首页：写清楚可以拍照解数学题。","w.c.opt3":"FAQ：回答「用 AI 写作业算不算作弊」。","w.c.result":"检查完了。问到「How to make flashcards from a textbook with AI」时，ChatGPT 现在会提到你，并引用你的闪卡页。整体：品牌被提及 7/10（原来 6），本站被引用 3/10（原来 2）。","w.c.next":"下一条：问到「App that solves math problems from a photo」时，没有提到你。","w.c.ccH":"闪卡页 · 补充 FAQ","w.topic.name":"闪卡页 · 补充 FAQ","w.topic.page":"闪卡功能页","w.res.faq":"闪卡页 FAQ","w.res.orig":"闪卡页原文","w.rv.srcNote":"原文从闪卡功能页留存；所有人工修改和已保存内容保留。采用时生成新保存记录，不覆盖来源。","w.sample":"示例数据 · 非真实检测", "plan.h":"布局方案","plan.A":"A · 每条优化一个子页面","plan.B":"B · 看板不动","plan.B2":"B2 · 两栏","plan.B3":"B3 · 看板（问题列表）+ 对话","plan.B4":"B4 · 看板 + 问题列表 + 对话","w.b4.queue":"所有问题","w.i.intro":"第 {n} 次检查在{p}（{url}）发现的。这一条改动的所有事情都留在这段对话里。","w.b3.all":"网站概览 · 总结","w.pg.prev":"上一页","w.pg.next":"下一页",

/* ---------- tour */
function TOURSTEPS(){
  if(PLAN==="B3") return [[["#tour-project"],"tour.1"],[["#ws-main"],"tour.2"],[[".ws-tasklist","#ws-chat"],"tour.3b"]];
  if(PLAN==="B4") return [[["#tour-project"],"tour.1"],[["#ws-main"],"tour.2"],[["#ws-side","#ws-chat"],"tour.3b"]];
  return [[["#tour-project"],"tour.1"],[[PLAN==="B2"?"#ws-board":"#ws-main .ws-in"],"tour.2"],[["#ws-chat"],"tour.3"]];
}
function renderTour(){
  var el = $("tour"), W = S.ws;
  if(!W || W.tour<0 || S.view!=="ws"){ el.hidden = true; return; }
  var step = TOURSTEPS()[W.tour], pad = 8, vw = window.innerWidth, vh = window.innerHeight;
  var holes = step[0].map(function(sel){ var el2 = document.querySelector(sel); if(!el2) return null; var r = el2.getBoundingClientRect();
    return {x:Math.max(4,r.left-pad), y:Math.max(4,r.top-pad), w:Math.min(vw-8,r.width+pad*2), h:Math.min(vh-8, r.height+pad*2)}; }).filter(Boolean);
  if(!holes.length){ el.hidden = true; return; }
  el.hidden = false;
  var hole = holes[0];
  var union = holes.reduce(function(a,b){ var x = Math.min(a.x,b.x), y = Math.min(a.y,b.y);
    return {x:x, y:y, w:Math.max(a.x+a.w,b.x+b.w)-x, h:Math.max(a.y+a.h,b.y+b.h)-y}; });
  var cw = 320, cx, cy;
  if(holes.length>1){
    var gapL = holes[0].x+holes[0].w, gapR = holes[1].x;
    cx = (gapR-gapL > cw+24) ? gapL+(gapR-gapL)/2-cw/2 : union.x+union.w/2-cw/2;
    cy = union.y+Math.min(union.h/2, 220);
  } else if(W.tour===0){ cx = hole.x+hole.w+16; cy = hole.y+hole.h+14; }
  else { cx = hole.x+hole.w/2-cw/2; cy = hole.y+Math.min(hole.h/2, 260); }

async function streamReply(m, key, at, btn){

function classify(v){
  if(/除了文案|besides (the )?copy|other than (the )?copy|else can improve/i.test(v)) return "q.more";
  if(/还有别的|别的地方|anything else|else to change/i.test(v)) return "q.same";
  if(/为什么|why/i.test(v)) return "q.why";
  if(/首页|homepage/i.test(v)) return "q.other";
  return "free";
}
async function wsAsk(v, key){
  var W = S.ws; key = key || classify(v);

  if(!W.conv){
    if(key==="q.more"){ var sid = addSiteConv("more"); W.conv = sid; W.page = PLAN==="A"?"topic":"overview"; var m = W.meta[sid]; m.asked["q.more"]=1; m.extra.push({u:v, at:W.checkNo}); await streamReply(m, "w.c.more.a", W.checkNo); return; }

  }

  if(key==="q.more"){ await streamReply(m, "w.c.more.a", W.checkNo); return; }

  if(key==="q.why"){ await streamReply(m, "r.why", W.checkNo, {act:"ws-newchat", topic:"why", k:"r.whyBtn"}); return; }
