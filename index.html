<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagewise Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#E9ECF5; --sunken:#F7F8FC;
  --ink:#131733; --ink-2:#4A5073; --ink-3:#7F86A6; --line:#DCE0EE; --line-2:#C9CEE2;
  --primary:#1C2766; --primary-hover:#26337F; --on-primary:#FFFFFF;
  --accent:#3A74D6; --accent-soft:#E2EBFB; --accent-ink:#1F4FA3;
  --add-bg:#E5EEFC; --add-line:#9DBBEE;
  --user-bg:#1C2766; --user-ink:#FFFFFF;
  --good:#1D7F55; --good-soft:#DFF2E8;
  --shadow:0 1px 2px rgba(19,23,51,.05), 0 12px 32px -16px rgba(19,23,51,.22);
  --scrim:rgba(13,16,38,.38);
  --display:"Newsreader","Noto Sans SC","PingFang SC",Georgia,sans-serif;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F23; --surface:#141835; --surface-2:#1B2044; --sunken:#10132C;
    --ink:#E8EAF6; --ink-2:#AEB3D0; --ink-3:#747B9E; --line:#252B55; --line-2:#323A6A;
    --primary:#E8EAF6; --primary-hover:#FFFFFF; --on-primary:#10142E;
    --accent:#7AA7F0; --accent-soft:#1A2753; --accent-ink:#A9C6F6;
    --add-bg:#16244A; --add-line:#3A5A99;
    --user-bg:#2A3372; --user-ink:#F1F3FC;
    --good:#52C48E; --good-soft:#123127;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 36px -18px rgba(0,0,0,.6);
    --scrim:rgba(4,6,18,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F23; --surface:#141835; --surface-2:#1B2044; --sunken:#10132C;
  --ink:#E8EAF6; --ink-2:#AEB3D0; --ink-3:#747B9E; --line:#252B55; --line-2:#323A6A;
  --primary:#E8EAF6; --primary-hover:#FFFFFF; --on-primary:#10142E;
  --accent:#7AA7F0; --accent-soft:#1A2753; --accent-ink:#A9C6F6;
  --add-bg:#16244A; --add-line:#3A5A99;
  --user-bg:#2A3372; --user-ink:#F1F3FC;
  --good:#52C48E; --good-soft:#123127;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 36px -18px rgba(0,0,0,.6);
  --scrim:rgba(4,6,18,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.in-app{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-line{border:1px solid var(--line-2);background:var(--surface)}
.btn-line:hover{border-color:var(--ink-3)}
.btn-quiet{color:var(--ink-2);padding:0 10px}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:default}
.link{color:var(--accent-ink);font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent)}

/* ================= LANDING ================= */
#landing,#diag,body:not(.in-app) .auth{--bg:#0B0C11;--surface:#15161E;--surface-2:#191B25;--sunken:#101117;--ink:#ECEDF3;--ink-2:#A6A9B8;--ink-3:#6E7183;--line:#23252F;--line-2:#30333F;
  --primary:#ECEDF3;--primary-hover:#FFFFFF;--on-primary:#0B0C11;--accent:#8AB0F2;--accent-soft:#1B2340;--accent-ink:#AFC8F5;--add-bg:#172240;--add-line:#3A5A99;
  --good:#52C48E;--good-soft:#12302A;--shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -20px rgba(0,0,0,.7);background:var(--bg);color:var(--ink);min-height:100%}
body:not(.in-app){background:#0B0C11}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1440px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,2.4vw,40px) 14px;color:var(--ink)}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.logo svg{width:22px;height:22px}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a,.nav-links button{padding:8px 12px;border-radius:999px;font-size:14px;color:var(--ink-2);text-decoration:none}
.nav-links a:hover,.nav-links button:hover{color:var(--ink);background:var(--surface-2)}
.nav-links .nav-login{background:var(--primary);color:var(--on-primary);margin-left:6px}
.nav-links .nav-login:hover{background:var(--primary-hover);color:var(--on-primary)}
@media (max-width:640px){.nav-links .hide-sm{display:none}}

.hero-frame{max-width:1440px;margin:0 auto;padding-inline:clamp(12px,2vw,24px)}
.hero-shell{position:relative;border-radius:clamp(20px,2.4vw,32px);isolation:isolate}
.hero-shell .edge,.hero-shell .halo{position:absolute;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .45s ease}
.hero-shell .edge{inset:0;z-index:3;padding:1px;background:radial-gradient(440px circle at var(--mx,50%) var(--my,50%),rgba(214,206,255,.8),rgba(220,170,220,.16) 45%,rgba(255,255,255,.05) 72%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hero-shell .halo{inset:-6px;z-index:-1;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(140,160,245,.55),rgba(210,140,200,.2) 45%,transparent 70%);filter:blur(24px)}
.hero-shell:hover .edge,.hero-shell:hover .halo{opacity:1}
.hero::after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%),radial-gradient(120% 90% at 50% 120%,rgba(8,9,16,.35),transparent 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.06)}
.hero-inner{position:relative;z-index:1}
.hero{position:relative;overflow:hidden;background:#090A12;color:#F4F5FF;border-radius:clamp(20px,2.4vw,32px);padding:clamp(104px,13vw,180px) 20px clamp(96px,12vw,164px);isolation:isolate}
#halftone{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.hero-inner{max-width:900px;margin:0 auto;text-align:center;pointer-events:none}
.hero-inner form,.hero-inner button,.hero-inner input{pointer-events:auto}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,5.1vw,66px);line-height:1.08;letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero h1 em{font-style:italic}
:lang(zh) .hero h1{letter-spacing:0;line-height:1.24;font-weight:500;font-size:clamp(32px,4.4vw,54px)}
.hero-sub{max-width:560px;margin:26px auto 0;font-size:clamp(15px,1.4vw,17px);line-height:1.55;color:rgba(236,239,255,.72);text-wrap:balance}
.ask{max-width:560px;margin:44px auto 0}
.ask-field{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:5px 5px 5px 18px;box-shadow:0 20px 50px -24px rgba(0,0,0,.6)}
.ask-field svg{width:18px;height:18px;color:#7F86A6;flex:none}
.ask-field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:#131733;height:44px;outline:none}
.ask-field input::placeholder{color:#8C92AE}
.ask-go{height:44px;padding:0 20px;border-radius:999px;background:#12153A;color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ask-go:hover{background:#262B66}
.ask-go svg{width:16px;height:16px;color:#fff}
.ask-examples{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding-top:18px;font-size:13px;color:rgba(236,239,255,.55)}
.chip-ex{color:rgba(236,239,255,.82);font-family:var(--mono);font-size:12px;text-decoration:underline;text-decoration-color:rgba(236,239,255,.25);text-underline-offset:4px}
.chip-ex:hover{color:#fff;text-decoration-color:rgba(255,255,255,.7)}
@media (max-width:520px){.ask-go span{display:none}.ask-go{padding:0 14px}}

.section{padding-block:clamp(64px,9vw,112px);padding-inline:16px}
.wrap{max-width:1120px;margin:0 auto}
.loop-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,6vw,88px);align-items:center}
@media (max-width:900px){.loop-grid{grid-template-columns:1fr}}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.06;letter-spacing:-.02em;margin:12px 0 0;text-wrap:balance}
:lang(zh) .h2{letter-spacing:0;line-height:1.25;font-weight:500}
.lede{color:var(--ink-2);font-size:17px;max-width:46ch;margin:16px 0 0}
.steps-list{list-style:none;margin:36px 0 0;padding:0;position:relative}
.steps-list li{display:grid;grid-template-columns:44px 1fr;gap:2px 16px;padding:0 0 22px;position:relative}
.steps-list li::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:1px;background:var(--line-2)}
.steps-list li:last-child::before{display:none}
.step-n{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--bg)}
.steps-list h3{margin:3px 0 0;font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2}
.steps-list p{grid-column:2;margin:2px 0 0;color:var(--ink-2);max-width:44ch}
.loop-back{display:flex;align-items:center;gap:10px;margin-left:60px;font-size:14px;color:var(--ink-3)}
.loop-back svg{width:16px;height:16px}
.preview{position:sticky;top:24px;border-radius:24px;padding:clamp(14px,2.4vw,28px);background:var(--surface-2)}
.preview-label{display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:12px;font-family:var(--mono);margin:0 2px 12px}
.preview .card{pointer-events:none}
.final{background:var(--surface-2);border-radius:24px;padding:clamp(40px,6vw,72px) clamp(20px,5vw,64px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
.final .h2{margin:0;font-size:clamp(30px,3.6vw,44px);max-width:18ch}
.footer{padding:28px 16px 40px;color:var(--ink-3);font-size:13px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ================= APP ================= */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;gap:18px;padding:14px 12px 14px;background:var(--sunken);border-right:1px solid var(--line);min-height:0}
.side .logo{color:var(--ink);padding:4px 8px}
.site-switch{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.site-fav{width:30px;height:30px;border-radius:8px;background:#1C2766;color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.site-switch b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.site-switch small{display:block;color:var(--ink-3);font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.side-new{justify-content:flex-start;width:100%}
.side-h{font-size:12px;color:var(--ink-3);padding:0 8px;margin-bottom:4px}
.chat-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.chat-item.on{background:var(--surface-2)}
.chat-item b{display:block;font-weight:500;font-size:14px}
.chat-item small{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.chat-item small i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.chat-item small i.hot{background:var(--accent)}
.chat-item small i.ok{background:var(--good)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.side-foot button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--ink-2);text-align:left}
.side-foot button:hover{background:var(--surface-2);color:var(--ink)}
.side-foot svg{width:16px;height:16px}

.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.mbar{display:flex;align-items:center;gap:clamp(14px,3vw,36px);flex-wrap:wrap;padding:12px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--bg)}
.menu-btn{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);place-items:center}
.menu-btn svg{width:18px;height:18px}
.metric{display:flex;flex-direction:column;min-width:0}
.metric label{font-size:12px;color:var(--ink-3)}
.metric .val{display:flex;align-items:baseline;gap:8px}
.metric .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.metric .num span{color:var(--ink-3);font-size:15px}
.delta{font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.skel{display:inline-block;width:64px;height:22px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.mbar-meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px dashed var(--line-2);color:var(--ink-3);font-family:var(--mono)}

.thread{overflow-y:auto;padding:28px 16px 24px;scroll-behavior:smooth}
.thread-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.item{display:flex;flex-direction:column;min-width:0}
.item.enter{animation:rise .35s ease-out both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.u{align-self:flex-end;max-width:80%;background:var(--user-bg);color:var(--user-ink);padding:9px 14px;border-radius:16px 16px 4px 16px}
.a{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.av svg{width:16px;height:16px}
.a-body{min-width:0;padding-top:3px}
.a-body p{margin:0}
.a-body p+p{margin-top:8px}
.typing{display:inline-flex;gap:4px;padding:10px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.divider{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-3);margin:10px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card.lift{box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-t{font-weight:600;font-size:15px}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* steps */
.run{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.run li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;font-size:14px;color:var(--ink-3)}
.run li.done,.run li.now{color:var(--ink)}
.run .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2)}
.run li.done .ic{background:var(--accent);border-color:var(--accent);color:#fff}
.run li.done .ic svg{width:12px;height:12px}
.run li.now .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.run .aside{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.bar{height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* understanding */
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;margin:14px 0 0;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill svg{width:12px;height:12px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.form{display:grid;gap:10px;margin-top:14px}
.form label{font-size:12px;color:var(--ink-3);display:grid;gap:4px}
.form input,.form textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:vertical}
.collapsed{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}

/* finding card */
.stages{display:flex;align-items:center;gap:6px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.stage{display:inline-flex;align-items:center;gap:6px}
.stage i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2)}
.stage.done{color:var(--ink-2)}
.stage.done i{background:var(--accent);border-color:var(--accent)}
.stage.now{color:var(--ink);font-weight:500}
.stage.now i{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage-sep{width:18px;height:1px;background:var(--line-2)}
.f-title{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
:lang(zh) .f-title{font-size:20px}
.f-problem{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.diff{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.diff-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.diff-h code{font-family:var(--mono);color:var(--ink-2)}
.diff-cur,.diff-add{padding:12px 14px;font-size:14px}
.diff-cur{color:var(--ink-3)}
.diff-add{background:var(--add-bg);border-top:1px dashed var(--add-line)}
.diff-lab{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;color:var(--ink-3)}
.diff-add .diff-lab{color:var(--accent-ink)}
.diff-add b{display:block;font-weight:600;margin-bottom:2px}
.f-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 18px;border-top:1px solid var(--line)}
.f-hint{font-size:12px;color:var(--ink-3);margin-left:auto}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
.todo li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;font-size:14px}
.todo .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;background:var(--surface-2);color:var(--ink-2)}
.todo .n.ok{background:var(--good);color:#fff}
.todo .n svg{width:12px;height:12px}
.exec-top{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.exec-top .pill{margin-right:auto}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;width:100%}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--good)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;width:100%}
.cmp>div{padding:10px 12px;border-radius:10px;background:var(--sunken);border:1px solid var(--line)}
.cmp .after{background:var(--good-soft);border-color:transparent}
.cmp small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.cmp .after small{color:var(--good)}
.cmp b{font-weight:500;font-size:14px}
.cmp .arr{display:grid;place-items:center;color:var(--ink-3)}
.cmp .arr svg{width:16px;height:16px}
.fine{font-size:12px;color:var(--ink-3);width:100%;margin:0}
.dismissed{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;font-size:14px;color:var(--ink-2)}
.next{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.next .t{flex:1;min-width:200px}
.next small{display:block;font-size:12px;color:var(--ink-3)}
.next b{font-weight:500}

.composer{padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer form{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);resize:none;outline:none;padding:7px 0;max-height:120px}
.composer textarea::placeholder{color:var(--ink-3)}
.send{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.send svg{width:16px;height:16px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:31;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:8px;padding:12px 12px 0 16px}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tab{padding:10px 12px;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ink)}
.x{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:var(--surface-2)}
.x svg{width:18px;height:18px}
.drawer-b{overflow-y:auto;padding:20px 20px 40px;border-top:1px solid var(--line)}
.drawer-b h4{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.25;margin:6px 0 12px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);margin-bottom:14px}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.answer{padding:14px 16px;border-radius:12px;background:var(--sunken);border:1px solid var(--line);font-size:14px}
.answer p{margin:0}.answer p+p{margin-top:8px}
.answer mark{background:var(--accent-soft);color:var(--accent-ink);padding:0 3px;border-radius:4px;font-weight:500}
.answer mark.you{background:var(--good-soft);color:var(--good)}
.srcs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.srcs li{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.srcs li span{color:var(--ink-3);width:18px}
.srcs li.you{color:var(--good)}
.sec-h{font-size:12px;color:var(--ink-3);margin:22px 0 8px;display:flex;justify-content:space-between;gap:8px}
.page-mock{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.page-url{padding:8px 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.page-body{padding:18px 18px 22px;font-size:14px}
.page-body h5{font-family:var(--display);font-size:24px;font-weight:500;margin:0 0 8px}
.page-body .ph{height:8px;border-radius:4px;background:var(--surface-2);margin:10px 0}
.page-add{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--add-bg);border:1px dashed var(--add-line)}
.qtable{width:100%;border-collapse:collapse;font-size:13px}
.qtable th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
.qtable td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.qtable td.c{text-align:center;width:64px}
.qtable tr.hl td{background:var(--add-bg)}
.yes{color:var(--good);font-weight:600}.no{color:var(--ink-3)}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brands span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.brands span.you{background:var(--primary);color:var(--on-primary);border-color:transparent}
.tbl-wrap{overflow-x:auto}

/* toast + proto */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;font-size:13px}
body.in-app .proto{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.proto-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#FFE9A8;color:#3B2F00;font-weight:500;box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.proto-btn i{width:7px;height:7px;border-radius:50%;background:#B7791F}
.proto-menu{position:absolute;right:0;bottom:44px;width:260px;max-height:70vh;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.proto-menu p{margin:6px 10px 6px;font-size:11px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.proto-menu button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:8px;gap:10px}
.proto-menu button:hover{background:var(--surface-2)}
.proto-menu button span{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:30px;flex:none}
.proto-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86%);z-index:40;transform:translateX(-102%);transition:transform .25s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.on{transform:none}
  .menu-btn{display:grid}
  .mbar{gap:14px 20px}
  .mbar-meta{margin-left:0;width:100%;justify-content:flex-start}
  .metric .num{font-size:20px}
  .u{max-width:88%}
  .f-hint{margin-left:0;width:100%}
}

/* ================= GLASS LAYER ================= */
:root{
  --bg:#ECEEF5;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.68); --glass-line:rgba(255,255,255,.75);
  --glass-edge:rgba(19,23,51,.08); --glass-hi:inset 0 1px 0 rgba(255,255,255,.9);
  --glass-sunken:rgba(255,255,255,.42); --glass-blur:blur(22px) saturate(1.5);
  --amb1:rgba(88,138,232,.38); --amb2:rgba(226,150,204,.34); --amb3:rgba(150,136,232,.26);
  --sunken:rgba(255,255,255,.45); --surface-2:rgba(19,23,51,.06); --add-bg:rgba(58,116,214,.1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C11;
    --glass:rgba(24,26,40,.42); --glass-strong:rgba(26,28,44,.58); --glass-line:rgba(255,255,255,.09);
    --glass-edge:rgba(0,0,0,.35); --glass-hi:inset 0 1px 0 rgba(255,255,255,.08);
    --glass-sunken:rgba(255,255,255,.035); --glass-blur:blur(24px) saturate(1.3);
    --amb1:rgba(64,108,210,.42); --amb2:rgba(190,96,168,.3); --amb3:rgba(110,96,210,.24);
    --sunken:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.06); --add-bg:rgba(122,167,240,.1);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C11;
  --glass:rgba(24,26,40,.42); --glass-strong:rgba(26,28,44,.58); --glass-line:rgba(255,255,255,.09);
  --glass-edge:rgba(0,0,0,.35); --glass-hi:inset 0 1px 0 rgba(255,255,255,.08);
  --glass-sunken:rgba(255,255,255,.035); --glass-blur:blur(24px) saturate(1.3);
  --amb1:rgba(64,108,210,.42); --amb2:rgba(190,96,168,.3); --amb3:rgba(110,96,210,.24);
  --sunken:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.06); --add-bg:rgba(122,167,240,.1);
}
#landing,#diag,body:not(.in-app) .auth{
  --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.12);
  --glass-edge:rgba(0,0,0,.4); --glass-hi:inset 0 1px 0 rgba(255,255,255,.12);
  --glass-sunken:rgba(255,255,255,.04); --glass-blur:blur(24px) saturate(1.4);
  --sunken:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.06); --add-bg:rgba(122,167,240,.12);
}
.glassy,.card,.site-switch,.btn-line,.composer form,.proto-menu,.final,.preview{
  background:var(--glass-strong);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-hi),0 10px 30px -18px var(--glass-edge);
}
.card.lift{box-shadow:var(--glass-hi),0 24px 48px -24px var(--glass-edge)}
.btn-line:hover{background:var(--glass-strong);border-color:var(--line-2)}
.diff,.page-mock,.answer,.cmp>div{background:var(--glass-sunken);border-color:var(--glass-line)}
.diff-h,.page-url{background:var(--glass-sunken);border-color:var(--glass-line)}
.stages,.f-foot{border-color:var(--glass-line)}

/* app: ambient light behind the glass */
.app{position:relative;isolation:isolate;background:var(--bg)}
.app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 46% at 6% 4%,var(--amb1),transparent 70%),radial-gradient(40% 50% at 98% 100%,var(--amb2),transparent 70%),radial-gradient(30% 36% at 72% 18%,var(--amb3),transparent 70%)}
.side{background:var(--glass);border-right:1px solid var(--glass-line);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.mbar{background:var(--glass);border-bottom:1px solid var(--glass-line);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.chat-item.on{background:var(--glass-strong);box-shadow:var(--glass-hi),0 0 0 1px var(--glass-line)}
.composer{background:none}
.drawer{background:var(--glass-strong);border-left:1px solid var(--glass-line);-webkit-backdrop-filter:blur(34px) saturate(1.4);backdrop-filter:blur(34px) saturate(1.4)}
.scrim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.proto-menu{background:var(--glass-strong)}
.toast{background:rgba(20,22,36,.72);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)}
.u{background:color-mix(in srgb,var(--user-bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

/* landing glass */
.ask-field{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px -24px rgba(0,0,0,.6)}
.ask-field input{color:#fff}
.ask-field input::placeholder{color:rgba(236,239,255,.5)}
.ask-field svg{color:rgba(236,239,255,.6)}
.ask-go{background:rgba(255,255,255,.92);color:#0B0C11}
.ask-go svg{color:#0B0C11}
.ask-go:hover{background:#fff}
.nav{position:sticky;top:0;z-index:20}
.nav::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(11,12,17,.55);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-links .nav-login{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.nav-links .nav-login:hover{background:rgba(255,255,255,.18);color:#fff}
#loop,.final-wrap{position:relative;isolation:isolate}
#loop::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(34% 48% at 78% 45%,rgba(70,110,210,.22),transparent 70%),radial-gradient(26% 36% at 62% 78%,rgba(190,100,170,.14),transparent 70%)}
.step-n{background:var(--glass);border-color:var(--glass-line);box-shadow:var(--glass-hi)}
.final{background:radial-gradient(60% 120% at 0% 100%,rgba(190,100,170,.16),transparent 60%),radial-gradient(50% 120% at 100% 0%,rgba(70,110,210,.2),transparent 60%),var(--glass)}
.final .btn-primary{background:rgba(255,255,255,.92);color:#0B0C11}
.proto-btn{background:rgba(255,233,168,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media (prefers-reduced-transparency: reduce){
  .card,.side,.mbar,.drawer,.composer form,.ask-field{-webkit-backdrop-filter:none;backdrop-filter:none}
}


/* how it works (compact) */
.how-head{text-align:center}
.how{list-style:none;margin:clamp(36px,5vw,56px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.how li{padding:22px 20px 24px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.how-n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.how h3{margin:18px 0 6px;font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2}
:lang(zh) .how h3{font-size:19px}
.how p{margin:0;color:var(--ink-2);font-size:14px}
@media (max-width:900px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.how{grid-template-columns:1fr}}
#loop::before{background:radial-gradient(40% 60% at 30% 70%,rgba(70,110,210,.16),transparent 70%),radial-gradient(30% 50% at 75% 60%,rgba(190,100,170,.12),transparent 70%)}
/* ================= LANDING INTRO ================= */
@keyframes in-frame{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:none}}
@keyframes in-down{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes in-word{from{opacity:0;transform:translateY(.35em);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes in-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero h1 .w{display:inline-block;white-space:pre}
#landing.play .nav{animation:in-down .7s cubic-bezier(.2,.8,.2,1) .15s both}
#landing.play .hero-shell{animation:in-frame 1s cubic-bezier(.16,.84,.24,1) both}
#landing.play .hero h1 .w{animation:in-word .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.38s + var(--i) * var(--step,.07s))}
#landing.play .hero-sub{animation:in-up .8s cubic-bezier(.2,.8,.2,1) .85s both}
#landing.play .ask-field{animation:in-up .8s cubic-bezier(.2,.8,.2,1) 1s both}
#landing.play .ask-examples{animation:in-up .8s cubic-bezier(.2,.8,.2,1) 1.12s both}
:lang(zh) .hero h1{--step:.035s}

/* ================= AUTH ================= */
.auth{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.auth-card{position:relative;width:min(420px,100%);border-radius:22px;padding:30px 24px 22px;color:var(--ink);
  background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--glass-line);
  box-shadow:var(--glass-hi),0 40px 90px -40px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  animation:in-up .35s cubic-bezier(.2,.8,.2,1) both}
.auth-card .x{position:absolute;top:10px;right:10px}
.auth-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.auth-mark svg{width:20px;height:20px}
.auth h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.2;margin:16px 0 6px;text-wrap:balance}
:lang(zh) .auth h2{font-size:22px}
.auth-sub{margin:0;color:var(--ink-2);font-size:14px}
.auth-stack{display:grid;gap:10px;margin-top:22px}
.btn-block{width:100%;height:44px;font-size:15px}
.g-dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg)}
.auth-or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--glass-line)}
.auth label{font-size:12px;color:var(--ink-3);display:grid;gap:6px}
.auth input{font:inherit;font-size:15px;color:var(--ink);height:44px;padding:0 12px;border-radius:10px;background:var(--glass-sunken);border:1px solid var(--glass-line);outline:none}
.auth input:focus{border-color:var(--accent)}
.auth-err{font-size:12px;color:#E5484D;margin:-2px 0 0}
.auth-fine{margin:16px 0 0;font-size:12px;color:var(--ink-3);text-align:center}
.auth-sent{margin-top:20px;padding:14px;border-radius:12px;background:var(--glass-sunken);border:1px solid var(--glass-line);font-size:14px;color:var(--ink-2)}
.acct{display:flex!important;align-items:center;gap:10px;min-width:0}
.acct .av-s{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--primary);color:var(--on-primary);flex:none}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.guest{color:var(--accent-ink)!important}

/* ================= FREE CHECK (pre-diagnosis) ================= */
#diag{min-height:100%;background:var(--bg);color:var(--ink);position:relative;isolation:isolate}
#diag::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 40% at 12% 8%,rgba(60,100,190,.22),transparent 70%),radial-gradient(36% 40% at 92% 96%,rgba(180,96,160,.14),transparent 70%)}
.dg{max-width:640px;margin:0 auto;padding-block:clamp(32px,7vh,80px) 96px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.dg-in{animation:in-up .5s cubic-bezier(.2,.8,.2,1) both}
.dg-head{margin-bottom:12px}
.dg h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1.1;letter-spacing:-.02em;margin:10px 0 0;text-wrap:balance}
:lang(zh) .dg h1{font-weight:500;letter-spacing:0;line-height:1.3;font-size:clamp(26px,4vw,38px)}
.dg-sub{margin:12px 0 0;color:var(--ink-2);font-size:16px;max-width:52ch}
.dg-domain{font-family:var(--mono);font-size:.62em;letter-spacing:0;color:var(--ink-2);display:block;margin-top:6px}
.dg .run li{font-size:15px}
.dg-foot{display:flex;justify-content:center;margin-top:8px}
.rp-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-metric{padding:18px 20px}
.rp-metric .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1}
.rp-metric .num span{font-size:20px;color:var(--ink-3)}
.rp-metric label{display:block;margin-top:8px;font-size:14px;color:var(--ink-2)}
.rp-h{font-size:13px;color:var(--ink-3);margin:18px 2px 0;display:flex;justify-content:space-between;gap:8px}
.gap-list{list-style:none;margin:0;padding:0}
.gap-list li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 18px;border-top:1px solid var(--glass-line)}
.gap-list li:first-child{border-top:0}
.gap-list b{font-weight:500;font-size:15px}
.gap-list small{grid-column:1;color:var(--ink-3);font-size:13px}
.gap-list .pill{align-self:start}
.big-q{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.25;margin:8px 0 4px;text-wrap:balance}
.lockfix{position:relative;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--glass-line);background:var(--add-bg)}
.lockfix .diff-add{background:transparent;border:0}
.lockfix .blur{filter:blur(5px);user-select:none}
.lock-badge{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);white-space:nowrap}
.lock-badge svg{width:14px;height:14px}
.rp-cta{display:grid;gap:10px;justify-items:center;margin-top:12px;text-align:center}
.rp-cta .btn-primary{height:50px;padding:0 28px;font-size:16px;border-radius:999px}
@media (max-width:520px){.rp-metric .num{font-size:34px}}

/* free check: three linear steps */
.stepper{list-style:none;margin:0 0 20px;padding:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.stepper li{display:inline-flex;align-items:center;gap:8px}
.stepper li.sep{width:28px;height:1px;background:var(--glass-line)}
.stepper .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;border:1px solid var(--glass-line);background:var(--glass)}
.stepper .sn svg{width:11px;height:11px}
.stepper li.on{color:var(--ink)}
.stepper li.on .sn{background:var(--primary);color:var(--on-primary);border-color:transparent}
.stepper li.done{color:var(--ink-2)}
.stepper li.done .sn{background:var(--accent);color:#fff;border-color:transparent}
.arows{list-style:none;margin:0;padding:0}
.arows li{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:16px 20px;border-top:1px solid var(--glass-line);color:var(--ink-3)}
.arows li:first-child{border-top:0}
.arows li.done,.arows li.now{color:var(--ink)}
.arows .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2)}
.arows li.done .ic{background:var(--accent);border-color:var(--accent);color:#fff}
.arows li.done .ic svg{width:12px;height:12px}
.arows li.now .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.arows .lbl{font-size:15px}
.arows .st{font-size:13px;color:var(--ink-3)}
.dg-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.dg-btn{height:46px;padding:0 22px;border-radius:999px;font-size:15px}
.dg-run{width:100%;padding:14px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line)}
.kvt{display:grid;grid-template-columns:minmax(120px,180px) 1fr;margin:0}
.kvt dt,.kvt dd{margin:0;padding:16px 20px;border-top:1px solid var(--glass-line);font-size:15px}
.kvt dt{color:var(--ink-3);font-size:14px}
.kvt dt:first-of-type,.kvt dd:first-of-type{border-top:0}
.kvt b{font-weight:600}
.dg-more summary{cursor:pointer;color:var(--ink-2);font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px}
.dg-more summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.dg-more[open] summary::before{transform:rotate(90deg)}
.dg-more summary::-webkit-details-marker{display:none}
.scope-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:12px}
.qlist{list-style:none;margin:12px 0;padding:0;display:grid;gap:10px;font-size:15px}
.qlist.num{list-style:decimal;padding-left:20px;font-size:14px;gap:6px;margin:0}
@media (max-width:640px){.scope-grid{grid-template-columns:1fr}.kvt{grid-template-columns:1fr}.kvt dd{border-top:0;padding-top:0}}

/* halftone floor under the free-check pages */
#dg-halftone{position:fixed;left:0;right:0;bottom:0;width:100%;height:58vh;z-index:-1;display:block;pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.85) 35%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.85) 35%,transparent 100%)}
#diag::before{background:radial-gradient(36% 30% at 14% 6%,rgba(60,100,190,.12),transparent 70%)}
.logo .logo-mark{width:28px;height:28px;display:block;object-fit:contain}
/* the mark is white glass: darken it on the light app theme */
:root:not([data-theme="dark"]) .side .logo-mark{filter:invert(1) brightness(.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side .logo-mark{filter:none}}
/* ================= WORKSPACE (conversation + dashboard) ================= */
body.ws-mode .proto{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;right:500px}
body.ws-mode .proto-menu{top:44px;bottom:auto}
@media (max-width:1180px){body.ws-mode .proto{right:436px}}
@media (max-width:900px){body.ws-mode .proto{right:16px}}
.ws{display:grid;grid-template-columns:240px minmax(0,1fr) 480px;height:100%;position:relative;isolation:isolate;background:var(--bg);color:var(--ink)}
.ws::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 46% at 6% 4%,var(--amb1),transparent 70%),radial-gradient(40% 50% at 98% 100%,var(--amb2),transparent 70%),radial-gradient(30% 36% at 60% 10%,var(--amb3),transparent 70%)}
.ws-side{display:flex;flex-direction:column;gap:18px;padding:14px 12px;min-height:0;overflow-y:auto;background:var(--glass);border-right:1px solid var(--glass-line);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.ws-side .logo{color:var(--ink);padding:4px 8px}
.ws-group{display:flex;flex-direction:column;gap:2px}
.ws-gh{font-size:12px;color:var(--ink-3);padding:0 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.ws-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--ink-2)}
.ws-item:hover{background:var(--surface-2);color:var(--ink)}
.ws-item.on{background:var(--glass-strong);color:var(--ink);box-shadow:var(--glass-hi),0 0 0 1px var(--glass-line)}
.ws-item small{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.ws-item small i{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.ws-item small i.hot{background:var(--accent)}.ws-item small i.ok{background:var(--good)}
.ws-item.row{flex-direction:row;align-items:center;justify-content:space-between}
.ws-item.ws-home{flex-direction:row;align-items:center;gap:10px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink)}
.ws-item.ws-home svg{flex-shrink:0;color:var(--ink-2)}
.ws-item.ws-home.on svg,.ws-item.ws-home:hover svg{color:var(--accent)}
.ws-empty{font-size:13px;color:var(--ink-3);padding:4px 10px}
.ws-add{font-size:13px;color:var(--ink-2);padding:6px 10px;text-align:left;border-radius:8px}
.ws-add:hover{color:var(--ink);background:var(--surface-2)}
.soon{font-family:var(--mono);font-size:10px;letter-spacing:.03em;padding:1px 7px;border-radius:999px;border:1px dashed var(--line-2);color:var(--ink-3);white-space:nowrap}
.ws-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.ws-foot button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink-2);text-align:left;min-width:0}
.ws-foot button:hover{background:var(--surface-2);color:var(--ink)}
.ws-foot button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-foot .av-s{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--primary);color:var(--on-primary);flex:none}

.ws-main{overflow-y:auto;min-height:0;padding:28px clamp(20px,3.5vw,48px) 56px}
.ws-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ws-crumb{font-size:13px;color:var(--ink-3)}
.ws-h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,3vw,36px);line-height:1.15;letter-spacing:-.01em;margin:2px 0 0}
:lang(zh) .ws-h1{font-weight:500;letter-spacing:0}
.ws-sub{font-size:14px;color:var(--ink-3);margin:0}
.ws-url{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.ws-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ws-tile{padding:18px 20px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.ws-tile.focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:var(--glass-hi),0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.ws-tile label{display:block;font-size:13px;color:var(--ink-2)}
.ws-tile .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.ws-tile .num span{font-size:18px;color:var(--ink-3)}
.ws-tile .skel{width:96px;height:36px;margin-top:10px}
.ws-toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);align-self:flex-start}
.ws-toggle:hover{color:var(--ink)}
.ws-toggle::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.ws-toggle.open::before{transform:rotate(90deg)}
.ws-box{padding:16px 18px;border-radius:14px;background:var(--glass-sunken);border:1px solid var(--glass-line);font-size:14px}
.ws-box p{margin:0}.ws-box p+p{margin-top:8px}
.ws-lab{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
:lang(zh) .ws-lab{text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px}
.ws-hr{height:1px;background:var(--glass-line);border:0;margin:6px 0}
.ws-sec h3{font-size:13px;font-weight:500;color:var(--ink-3);margin:0 0 6px}
.ws-sec p{margin:0}
.ws-recent{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:18px 20px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--glass-hi)}
.ws-recent .t{flex:1;min-width:200px}
.ws-recent b{display:block;font-weight:600;font-size:16px}
.ws-recent small{color:var(--ink-3);font-size:13px}
.ws-soonrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ws-soonrow div{padding:14px 16px;border-radius:14px;border:1px dashed var(--line-2);color:var(--ink-3);font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ws-soonrow b{color:var(--ink-2);font-weight:500;font-size:14px}
.ws-add-block{border-radius:10px;background:var(--add-bg);border-top:1px dashed var(--add-line);padding:12px 14px}
.ws-add-block b{display:block;font-weight:600;margin-bottom:2px}
.ws-quote{font-family:var(--display);font-size:17px;line-height:1.45;color:var(--ink)}
.ws-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.ws-callout{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:14px;border:1px dashed var(--line-2)}
.ws-callout b{font-weight:600}
.ws-callout p{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:52ch}

.ws-chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;border-left:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.ws-chat-h{padding:16px 18px;border-bottom:1px solid var(--glass-line)}
.ws-chat-h .row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
body.plan-b3 .ws-chat-h{display:block;padding-bottom:10px}
body.plan-b3 .ws-chat,body.plan-b3 .ws-main{min-width:0}
body.plan-b3 .cv-switch{min-width:0;max-width:100%}
.ws-chat-h b{display:block;font-weight:600;font-size:15px}
.ws-chat-h small{font-size:12px;color:var(--ink-3)}
.ws-chat-b{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.cb-a{display:flex;flex-direction:column;gap:8px;font-size:14px;align-items:flex-start}
.cb-a .who{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.cb-a p{margin:0;line-height:1.55}
.cb-u{align-self:flex-end;max-width:85%;background:color-mix(in srgb,var(--user-bg) 82%,transparent);color:var(--user-ink);padding:8px 13px;border-radius:14px 14px 4px 14px;font-size:14px}
.cc{width:100%;border-radius:14px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 14px 30px -20px var(--glass-edge);overflow:hidden}
.cc-h{padding:10px 14px;font-size:12px;font-weight:600;border-bottom:1px solid var(--glass-line)}
.cc-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.cc-cur{color:var(--ink-3)}
.cc-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px 12px;border-top:1px solid var(--glass-line)}
.cc-f small{flex-basis:100%;font-size:12px;color:var(--ink-3)}
.cb-fold{width:100%;font-size:13px}
.cb-fold .ws-toggle{font-size:13px}
.cb-fold .ws-box{margin-top:8px;font-size:13px}
.ws-chat-f{padding:12px 14px 16px;border-top:1px solid var(--glass-line)}
.ws-chat-f form{display:flex;flex-direction:column;gap:8px}
.ws-chat-f textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--glass-sunken);border:1px solid var(--glass-line);border-radius:12px;padding:10px 12px;resize:none;min-height:58px;outline:none}
.ws-chat-f textarea:focus{border-color:var(--accent)}
.ws-chat-f .row{display:flex;justify-content:flex-end}

.ws-in > .link{align-self:flex-start}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0 2px;font-size:12px;color:var(--ink-3)}
.pager .pg{width:28px;height:28px;border-radius:8px;border:1px solid var(--glass-line);color:var(--ink-2);font-size:15px;line-height:1}
.pager .pg:hover:not([disabled]){color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pager .pg[disabled]{opacity:.35}
.ws-soonrow button{padding:14px 16px;border-radius:14px;border:1px dashed var(--line-2);color:var(--ink-3);font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;width:100%}
.ws-soonrow button:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--ink-2)}
.ws-soonrow button b{color:var(--ink-2);font-weight:500;font-size:14px}
.proj-wrap{position:relative;margin-left:auto}
.proj-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:270px;padding:5px;border-radius:12px;border:1px solid var(--glass-line);background:#131210;box-shadow:0 22px 44px -18px #000}
.pm-g{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:8px 9px 4px}
.pm-i{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;text-align:left}
.pm-i:hover,.pm-r:hover{background:var(--surface-2)}
.pm-i b{display:block;font-size:13px;font-weight:500;color:var(--ink)}
.pm-i small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.pm-i .mono{margin-left:auto;color:var(--accent)}
.pm-i .soon,.pm-r .soon{margin-left:auto}
.pm-r{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:8px;font-size:13px;color:var(--ink-2);text-align:left}
.pm-edit{padding:8px 9px;display:flex;flex-direction:column;gap:8px}
.pm-edit .row{display:flex;gap:8px}
.pm-edit small{font-size:11px;color:var(--ink-3);line-height:1.4}
.pm-sep{height:1px;background:var(--glass-line);margin:5px 4px}
/* chat switcher dropdown (B3) */
.cv-sel{position:relative;display:flex;align-items:center;gap:8px;width:100%}
.cv-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;border:1px solid var(--glass-line);background:var(--glass-sunken);color:var(--ink);font-size:14px;text-align:left}
.cv-btn b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-btn small{margin-left:auto;color:var(--ink-3);font-size:12px;flex:none}
.cv-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cv-new{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--glass-line);color:var(--ink-2);font-size:17px;line-height:1}
.cv-new:hover{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cv-menu{position:absolute;top:calc(100% + 6px);left:0;right:44px;z-index:20;max-height:360px;overflow-y:auto;padding:5px;border-radius:12px;border:1px solid var(--glass-line);background:#131210;box-shadow:0 22px 44px -18px #000}
.cv-menu .cvg{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:8px 9px 4px}
.cv-row{display:flex;align-items:center;gap:6px}
.cv-row>button:first-child{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 9px;border-radius:8px;text-align:left}
.cv-row>button:first-child:hover{background:var(--surface-2)}
.cv-row.on>button:first-child{background:var(--glass-strong)}
.cv-row .cvt{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-row .cvm{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.cv-row .cvm .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.cv-row .cvm .dot.todo,.cv-row .cvm .dot.open{background:var(--accent)}
.cv-row .cvm .dot.adopted,.cv-row .cvm .dot.live,.cv-row .cvm .dot.cited{background:var(--good)}
.cv-x{flex:none;width:26px;height:26px;border-radius:7px;color:var(--ink-3);font-size:13px}
.cv-x:hover{color:var(--ink);background:var(--surface-2)}
/* dashboard task + progress HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:2px 0 4px}
.hud .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass-sunken);font-size:12px;color:var(--ink-2)}
.hud .chip b{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:500}
.hud .chip i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.hud .chip i.todo{background:var(--accent)}.hud .chip i.live{background:var(--good)}
.hud-bar{flex:1;min-width:120px;height:6px;border-radius:999px;background:var(--glass-sunken);overflow:hidden}
.hud-bar span{display:block;height:100%;background:var(--good);border-radius:999px}
body.inner .hud .chip{border-radius:4px}
/* ---- Plan B4: dashboard | issue queue | chat ---- */
body.plan-b4 .ws{grid-template-columns:minmax(0,1fr) clamp(215px,17vw,275px) clamp(340px,29vw,450px)}
body.plan-b4 .ws-main{order:1;min-width:0;padding-top:0}
body.plan-b4 .ws-side{order:2;min-width:0;border-left:1px solid var(--glass-line);padding:14px 10px}
body.plan-b4 .ws-chat{order:3;min-width:0}
body.plan-b4 .ws-in{max-width:780px}
.iq{display:flex;flex-direction:column;gap:14px}
.iq-h{display:flex;flex-direction:column;gap:2px;padding:0 8px 2px}
.iq-h b{font-size:13px;font-weight:600;color:var(--ink)}
.iq-h small{font-size:12px;color:var(--ink-3)}
.iq-g{display:flex;flex-direction:column;gap:2px}
.iq-p{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 4px}
.iq-i{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:8px 9px;border-radius:9px;border:1px solid transparent}
.iq-i:hover{background:var(--surface-2)}
.iq-i.on{background:var(--glass-strong);border-color:var(--glass-line)}
body.inner .iq-i.on{background:#1B1B1A;border-color:transparent;box-shadow:inset 2px 0 0 var(--accent)}
.iq-t{font-size:13px;line-height:1.35;color:var(--ink)}
.iq-m{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.iq-m .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.iq-m .dot.todo,.iq-m .dot.open{background:var(--accent)}
.iq-m .dot.adopted,.iq-m .dot.live,.iq-m .dot.cited{background:var(--good)}
/* ---- Plan B3: big dashboard left, one merged assistant column right ---- */
body.plan-b3 .ws{grid-template-columns:minmax(0,1fr) clamp(380px,34vw,520px)}
body.plan-b3 .ws-side{display:none}
body.plan-b3 .ws-main{padding-top:0}
body.plan-b3 .ws-in{max-width:840px}
.ws-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:14px 0 16px;margin-bottom:4px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.ws-top .logo{padding:0;color:var(--ink)}
.ws-top .site-switch{width:auto;max-width:280px;margin-left:auto;padding:6px 10px}
.ws-top .av-s{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--primary);color:var(--on-primary);flex:none}
.cv-switch{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cv-switch::-webkit-scrollbar{display:none}
.cv-switch button{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;color:var(--ink-2);border:1px solid var(--glass-line);background:var(--glass-sunken);white-space:nowrap}
.cv-switch button:hover{color:var(--ink)}
.cv-switch button.on{background:var(--glass-strong);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.cv-switch button .nd{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
body.inner .cv-switch button{border-radius:4px}
body.inner .cv-switch button.on{background:#1B1B1A;border-color:rgba(224,179,106,.55)}
/* ---- Plan B2: two columns (board left, work area right) ---- */
body.plan-b2 .ws{grid-template-columns:clamp(300px,26vw,380px) minmax(0,1fr)}
body.plan-b2 .ws-main{display:none}
body.plan-b2 .ws-side{gap:12px;padding:14px 14px 18px}
body.plan-b2 .ws-ctl{padding:10px 12px;gap:8px 10px}
body.plan-b2 .ws-ctl .l{min-width:0}
body.plan-b2 .ws-ctl .l small{font-size:11px;line-height:1.35}
body.plan-b2 .ws-ctl .seg{flex-basis:100%}
body.plan-b2 .ws-chat-b{padding:22px max(24px,calc((100% - 900px)/2))}
body.plan-b2 .ws-chat-h{padding:16px max(24px,calc((100% - 900px)/2))}
body.plan-b2 .ws-chat-f{padding:12px max(24px,calc((100% - 900px)/2)) 18px}
.bd{display:flex;flex-direction:column;gap:10px}
.bd-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd-metrics .ws-tile{padding:12px 14px}
.bd-metrics .ws-tile label{font-size:12px}
.bd-metrics .ws-tile .num{font-size:30px;margin-top:2px}
.bd-metrics .ws-tile .num span{font-size:14px}
.bd-metrics .ws-tile .delta{margin-top:2px;font-size:11px}
.bd-sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 2px 0}
.bd-sec h3{font-size:12px;font-weight:500;color:var(--ink-3);margin:0}
.bd-sum{font-size:12px;color:var(--accent);margin:0 2px;line-height:1.45}
.bd-list{display:flex;flex-direction:column;gap:2px}
.bd-row{border-radius:10px;border:1px solid transparent}
.bd-row.on{background:var(--glass-strong);border-color:var(--glass-line)}
body.inner .bd-row.on{background:#1B1B1A;border-color:transparent;box-shadow:inset 2px 0 0 var(--accent)}
.bd-b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:9px 11px;border-radius:10px;align-items:center}
.bd-b:hover{background:var(--surface-2)}
.bd-row.on .bd-b:hover{background:transparent}
.bd-b .bd-t{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:6px;min-width:0}
.bd-b .bd-t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-b small{grid-column:1;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-b .pill{grid-column:2;grid-row:1 / span 2;white-space:nowrap}
.bd-tl{padding:0 11px 10px}
.bd-tl .tl-h{margin-top:0}
@media (max-width:1180px){.ws{grid-template-columns:220px minmax(0,1fr) 416px}}
@media (max-width:900px){
  body.in-app.ws-mode{overflow:auto}
  .ws{display:flex;flex-direction:column;height:auto;min-height:100%}
  .ws-side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;border-right:0;border-bottom:1px solid var(--glass-line);overflow:visible}
  .ws-side .ws-group,.ws-side .ws-foot{display:none}
  .ws-main{overflow:visible;padding:20px 16px 28px}
  .ws-chat{border-left:0;border-top:1px solid var(--glass-line);min-height:420px}
  .ws-tiles,.ws-soonrow{grid-template-columns:1fr}
}

/* ================= INNER PAGES · warm noir ================= */
#diag,#ws,body.inner .auth,body.inner .toast,body.inner .proto-menu,body.inner .scrim,body.inner .drawer{
  --bg:#0F0F0F; --surface:#161616; --surface-2:#1D1D1C; --sunken:#131313;
  --ink:#F1EEE8; --ink-2:#A9A59D; --ink-3:#6F6B64; --line:#262625; --line-2:#34332F;
  --primary:#DAD7D0; --primary-hover:#E8E6E1; --on-primary:#111111;
  --accent:#E0B36A; --accent-soft:rgba(224,179,106,.12); --accent-ink:#E8C48A;
  --add-bg:rgba(224,179,106,.07); --add-line:rgba(224,179,106,.35);
  --user-bg:#26241F; --user-ink:#F1EEE8;
  --good:#9DB8A0; --good-soft:rgba(157,184,160,.12);
  --glass:#131313; --glass-strong:#171717; --glass-line:#262625; --glass-edge:transparent; --glass-hi:0 0 0 0 transparent;
  --glass-sunken:#121212; --glass-blur:none;
  --amb1:transparent; --amb2:transparent; --amb3:transparent;
  --scrim:rgba(0,0,0,.72); --shadow:0 24px 60px -30px rgba(0,0,0,.8);
}
body.inner{background:#0F0F0F}
body.inner #diag::before,body.inner .ws::before{display:none}
body.inner .card,body.inner .ws-tile,body.inner .ws-recent,body.inner .cc,body.inner .ws-box{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
body.inner .nav::before{background:rgba(15,15,15,.85);border-bottom-color:#1F1F1E}
body.inner .kicker{color:var(--ink-3)}
/* retro bevel button, as in the reference */
body.inner .btn-primary,body.inner .dg-btn{border-radius:3px;background:#DAD7D0;color:#111;font-family:var(--mono);font-weight:500;letter-spacing:-.01em;
  box-shadow:inset 1px 1px 0 #FFFFFF,inset -1px -1px 0 #8C8981,0 1px 0 #000,0 0 0 1px #000}
body.inner .btn-primary:hover,body.inner .dg-btn:hover{background:#E6E4DF}
body.inner .btn-primary:active,body.inner .dg-btn:active{box-shadow:inset -1px -1px 0 #FFFFFF,inset 1px 1px 0 #8C8981,0 0 0 1px #000}
body.inner .btn-line{border-radius:3px;background:transparent;border-color:#34332F;font-family:var(--mono)}
body.inner .btn-quiet{font-family:var(--mono);font-size:13px}
body.inner .run li.done .ic,body.inner .arows li.done .ic,body.inner .stepper li.done .sn{color:#111}
body.inner .stepper li.on .sn{box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #8C8981}
body.inner .ws-tile{border-radius:6px}
body.inner .ws-tile.focus{border-color:rgba(224,179,106,.55);box-shadow:none}
body.inner .ws-tile .num{font-family:var(--display);font-weight:400;font-size:52px;letter-spacing:-.02em}
body.inner .ws-tile .num span{font-family:var(--mono);font-size:16px}
body.inner .card,body.inner .ws-box,body.inner .ws-recent,body.inner .cc,body.inner .auth-card{border-radius:6px}
body.inner .auth-card{background:#141414;border-color:#2A2A28;box-shadow:0 40px 90px -40px #000}
body.inner .ws-side,body.inner .ws-chat{background:#111111}
/* dark scrollbars everywhere inside the app shell */
body.inner *{scrollbar-width:thin;scrollbar-color:#2E2E2B transparent}
body.inner ::-webkit-scrollbar{width:11px;height:11px;background:transparent}
body.inner ::-webkit-scrollbar-track{background:transparent}
body.inner ::-webkit-scrollbar-thumb{background:#2E2E2B;border-radius:8px;border:3px solid transparent;background-clip:content-box}
body.inner ::-webkit-scrollbar-thumb:hover{background:#3C3C38;background-clip:content-box}
body.inner ::-webkit-scrollbar-corner{background:transparent}
/* B4: give each of the three zones its own surface */
body.inner.plan-b4 .ws-main,body.inner.plan-b3 .ws-main{background:rgba(255,255,255,.04)}
body.inner.plan-b4 .ws-side{background:rgba(8,8,7,.55);border-left:1px solid #201F1C}
body.inner.plan-b4 .ws-chat,body.inner.plan-b3 .ws-chat{background:#0C0B0A;border-left:1px solid #26251F}
body.inner.plan-b4 .ws-chat-h,body.inner.plan-b4 .ws-chat-f{border-color:#26251F}
body.inner.plan-b4 .cc,body.inner.plan-b4 .ws-box{background:#100F0D;border-color:#2A2924}
body.plan-b4 .ws-top,body.plan-b3 .ws-top{background:transparent;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.inner .ws-item.on{background:#1B1B1A;box-shadow:inset 2px 0 0 var(--accent)}
body.inner .soon{border-color:#3A3833;color:#86817A}
body.inner .ws-add-block{border-radius:4px}
body.inner .site-fav{background:#DAD7D0;color:#111;border-radius:3px;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #8C8981}
body.inner .cb-u{background:#26241F;border-radius:6px 6px 2px 6px}
body.inner .pill{border-radius:3px;background:#1D1D1C}
body.inner .dg h1,body.inner .ws-h1{font-weight:400;letter-spacing:-.02em}
body.inner #dg-halftone{-webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 45%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 45%,transparent 100%)}

/* ================= LANDING · warm ================= */
#landing{--bg:#0F0F0F; --surface:#161616; --surface-2:#1C1C1B; --sunken:#131313;
  --ink:#F1EEE8; --ink-2:#A9A59D; --ink-3:#6F6B64; --line:#262625; --line-2:#34332F;
  --accent:#E0B36A; --accent-soft:rgba(224,179,106,.12); --accent-ink:#E8C48A;
  --add-bg:rgba(224,179,106,.08); --add-line:rgba(224,179,106,.35)}
body:not(.in-app):not(.inner){background:#0F0F0F}
.hero{background:#0E0D0C}
.nav::before{background:rgba(15,15,15,.6)}
.hero-shell .edge{background:radial-gradient(440px circle at var(--mx,50%) var(--my,50%),rgba(241,226,200,.45),rgba(224,179,106,.1) 45%,rgba(255,255,255,.04) 72%)}
.hero-shell .halo{background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(224,179,106,.2),rgba(185,120,107,.08) 45%,transparent 70%)}
#loop::before{background:radial-gradient(40% 60% at 30% 70%,rgba(224,179,106,.08),transparent 70%),radial-gradient(30% 50% at 75% 60%,rgba(185,120,107,.08),transparent 70%)}
.final{background:radial-gradient(60% 120% at 0% 100%,rgba(185,120,107,.14),transparent 60%),radial-gradient(50% 120% at 100% 0%,rgba(224,179,106,.12),transparent 60%),var(--glass)}
.ask-go{color:#111}

/* faint star floor behind the workspace dashboard (side + chat panels stay solid) */
body.ws-mode #dg-halftone{position:absolute;left:240px;right:auto;width:calc(100% - 240px - 480px);height:58%;opacity:.75}
@media (max-width:1180px){body.ws-mode #dg-halftone{left:220px;width:calc(100% - 220px - 416px)}}
@media (max-width:900px){body.ws-mode #dg-halftone{display:none}}

/* workspace: user-triggered checks + optional auto-check */
.ws-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border:1px solid var(--glass-line);border-radius:6px;background:var(--glass-strong)}
.ws-ctl .l{flex:1;min-width:170px;display:flex;flex-direction:column}
.ws-ctl .l b{font-weight:600;font-size:14px}.ws-ctl .l small{font-size:12px;color:var(--ink-3)}
.ws-auto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.ws-auto .seg{margin:0}
.ws-ctl-next{flex-basis:100%;font-size:12px;color:var(--ink-3)}
.sw{width:34px;height:20px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.sw.on{background:var(--accent)}.sw.on i{transform:translateX(14px);background:#111}
.ws-tile .delta{display:inline-block;margin-top:6px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.cb-a .cmp small{font-size:10px}
body.inner .seg{border-radius:4px;background:#1B1B1A}body.inner .seg button{border-radius:3px;font-size:12px}body.inner .seg button.on{background:#DAD7D0;color:#111}

/* Chinese: no faux italics; emphasis by colour instead */
:lang(zh) .hero h1 em{font-style:normal;color:#E8C48A}
:lang(zh) .hero h1,:lang(zh) .dg h1,:lang(zh) .ws-h1,:lang(zh) .h2{letter-spacing:.01em}

/* checks panel: two rows; chat intro */
.ws-ctl{flex-direction:column;align-items:stretch;gap:12px}
.ws-ctl-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.ws-ctl-row .l{flex:1;min-width:170px;display:flex;flex-direction:column}
.ws-ctl-row.ws-auto{padding-top:12px;border-top:1px solid var(--glass-line)}
.cb-intro{font-size:13px;line-height:1.6;color:var(--ink-2);padding:12px 14px;border:1px dashed var(--line-2);border-radius:6px}

.stepper .step-go{display:inline-flex;align-items:center;gap:8px;color:inherit;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.stepper .step-go:hover{color:var(--ink)}
.stepper .step-go:hover .sn{box-shadow:0 0 0 3px var(--accent-soft)}

/* tasks in chat + overview; first-visit tour */
.tasks .tasks-h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.tasks .tasks-h .muted{font-weight:400}
.tk-list{display:flex;flex-direction:column}
.tk{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px;border-top:1px solid var(--glass-line);width:100%}
.tk:first-child{border-top:0}
.tk:hover{background:var(--surface-2)}
.tk.on{background:#1B1B1A;box-shadow:inset 2px 0 0 var(--accent)}
.tk .tn,.ws-trow .tn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);color:var(--ink-2);flex:none}
.tk.done .tn,.ws-trow .tn.done{background:var(--good);color:#111;border-color:transparent}
.tk .tn svg,.ws-trow .tn svg{width:11px;height:11px}
.tt{min-width:0}.tt b{display:block;font-weight:500;font-size:13px;color:var(--ink)}.tt small{font-size:12px;color:var(--ink-3)}
.tk.done .tt b{color:var(--ink-2)}
.cb-div{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:4px}
.cb-div::before,.cb-div::after{content:"";flex:1;height:1px;background:var(--glass-line)}
.ws-tasklist{border:1px solid var(--glass-line);border-radius:6px;overflow:hidden;background:var(--glass-strong)}
.ws-trow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--glass-line);flex-wrap:wrap}
.ws-trow:first-child{border-top:0}
.ws-trow .t{flex:1;min-width:200px}.ws-trow .t b{display:block;font-weight:500;font-size:14px}.ws-trow .t small{font-size:12px;color:var(--ink-3)}
.ws-gh span{font-family:var(--mono);font-size:11px}
.tour{position:fixed;inset:0;z-index:65}

.tour-card{position:absolute;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border-radius:6px;background:#161616;border:1px solid #2A2A28;color:#F1EEE8;box-shadow:0 30px 60px -20px #000;animation:in-up .3s both}
.tour-card small{font-size:11px;color:#6F6B64}
.tour-card b{font-size:16px;font-weight:600}
.tour-card p{margin:0;font-size:14px;line-height:1.55;color:#A9A59D}
.tour-a{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

.proto-menu button.on{background:var(--surface-2)}
.proto-menu button.on b::after{content:" ✓";color:var(--accent)}

.pv{border:1px solid var(--glass-line);border-radius:8px;overflow:hidden;background:#F6F4EF;color:#1C1B19;box-shadow:0 30px 60px -30px #000}

.pv-nav .on{color:#1C1B19;font-weight:600}
